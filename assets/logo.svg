<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Realmdle's bot logo: a Sorcery card holding the six clue tiles, the first
       guess mixed and the second solved, under a spark, in an arcane ring.
       Discord crops avatars to a circle, so everything sits inside r=440. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3b2a6b"/>
      <stop offset="0.55" stop-color="#1d1438"/>
      <stop offset="1" stop-color="#0d0919"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dd9a"/>
      <stop offset="0.5" stop-color="#c9a24f"/>
      <stop offset="1" stop-color="#8a6a2a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2045"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3dd9a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3dd9a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- arcane ring -->
  <g fill="none" stroke="url(#gold)" opacity="0.8">
    <circle cx="512" cy="512" r="420" stroke-width="6"/>
    <circle cx="512" cy="512" r="392" stroke-width="2" opacity="0.6"/>
  </g>
  <g fill="#c9a24f" opacity="0.85">
    <circle cx="512" cy="92" r="10"/>
    <circle cx="512" cy="932" r="10"/>
    <circle cx="92" cy="512" r="10"/>
    <circle cx="932" cy="512" r="10"/>
  </g>

  <!-- the card -->
  <g transform="translate(512 520) scale(1.16) translate(-512 -532) rotate(-7 512 540)" filter="url(#shadow)">
    <rect x="322" y="262" width="380" height="540" rx="34" fill="url(#gold)"/>
    <rect x="338" y="278" width="348" height="508" rx="24" fill="url(#face)"/>
    <rect x="356" y="296" width="312" height="472" rx="16" fill="none" stroke="#c9a24f" stroke-width="3" opacity="0.5"/>

    <!-- spark -->
    <circle cx="512" cy="392" r="70" fill="url(#glow)"/>
    <path d="M512 336 L526 378 L568 392 L526 406 L512 448 L498 406 L456 392 L498 378 Z" fill="url(#gold)"/>

    <!-- six clue tiles: a mixed guess, then all green -->
    <g>
      <rect x="376" y="490" width="80" height="80" rx="12" fill="#6aaa64"/>
      <rect x="472" y="490" width="80" height="80" rx="12" fill="#e2b93b"/>
      <rect x="568" y="490" width="80" height="80" rx="12" fill="#3c3654"/>
      <rect x="376" y="586" width="80" height="80" rx="12" fill="#6aaa64"/>
      <rect x="472" y="586" width="80" height="80" rx="12" fill="#6aaa64"/>
      <rect x="568" y="586" width="80" height="80" rx="12" fill="#6aaa64"/>
    </g>
    <rect x="452" y="700" width="120" height="8" rx="4" fill="#c9a24f" opacity="0.6"/>
  </g>
</svg>
