# Keeps the Realmdle card pool current.
#
# Once a day it asks the Sorcery Card Registry whether a new release exists
# (an 80-byte checksum; the 6 MB export is only downloaded when it changed),
# runs the tests and commits data/cards.json to main, then deploys so
# the Worker bundles the new cards. New cards become answers through the
# Worker's planner, 14 days after their set's release.
name: Refresh Realmdle cards

on:
  schedule:
    # 16:23 UTC is 02:23 or 03:23 in Sydney, after the daily puzzle turns over
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh the card pool
        run: npm run fetch-cards

      - name: Test
        run: npm test

      # A push made with the workflow token does not trigger other
      # workflows, so the deploy is started explicitly.
      - name: Commit and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/cards.json; then
            echo "Card pool is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git commit -m "Refresh Realmdle card pool"
          git push
          gh workflow run deploy.yml --ref main
